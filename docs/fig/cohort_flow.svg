wn &lt;= T; nothing left to predict</text><rect x='40' y='320' width='300' height='54' rx='8' fill='#111c24' stroke='#2a3a45' stroke-width='1'/><text x='52.0' y='341.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#e8eef2' text-anchor='start' font-weight='600'>Remaining: 1,397 stays</text><text x='52.0' y='360.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#a9b8c1' text-anchor='start' font-weight='normal'>1,161 patients; 110 AKI events (7.9%)</text><line x1='190.0' y1='374' x2='190.0' y2='408' stroke='#3a4b56' stroke-width='1.5'/><line x1='190.0' y1='384.0' x2='420' y2='384.0' stroke='#3a4b56' stroke-width='1.5'/><rect x='420' y='364.0' width='410' height='42' rx='6' fill='#111c24' stroke='#2a3a45'/><text x='430.0' y='381.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#e8eef2' text-anchor='start' font-weight='600'>Excluded: Acute RRT by T (n = 3)</text><text x='430.0' y='396.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#a9b8c1' text-anchor='start' font-weight='normal'>dialysis / CVVH started &lt;= T: prevalent KDIGO stage 3</text><rect x='40' y='408' width='300' height='54' rx='8' fill='#111c24' stroke='#2a3a45' stroke-width='1'/><text x='52.0' y='429.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#e8eef2' text-anchor='start' font-weight='600'>Remaining: 1,394 stays</text><text x='52.0' y='448.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#a9b8c1' text-anchor='start' font-weight='normal'>1,158 patients; 109 AKI events (7.8%)</text><line x1='190.0' y1='462' x2='190.0' y2='496' stroke='#3a4b56' stroke-width='1.5'/><line x1='190.0' y1='472.0' x2='420' y2='472.0' stroke='#3a4b56' stroke-width='1.5'/><rect x='420' y='452.0' width='410' height='42' rx='6' fill='#111c24' stroke='#2a3a45'/><text x='430.0' y='469.0' font-family='Inter, Segoe UI, Hel