<svg xmlns='http://www.w3.org/2000/svg' width='860' height='780' viewBox='0 0 860 780' role='img' aria-label='Cohort flow diagram' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Cohort flow diagram</title><rect rx='14' width='860' height='780' fill='#0b1218'/><text x='40.0' y='30.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#e8eef2' text-anchor='start' font-weight='600'>Cohort flow: eICU-CRD Demo v2.0.1, prediction at T = 24 h, baseline A</text><rect x='40' y='56' width='300' height='54' rx='8' fill='#111c24' stroke='#2a3a45' stroke-width='1'/><text x='52.0' y='77.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#e8eef2' text-anchor='start' font-weight='600'>All ICU stays: 2,520 stays</text><text x='52.0' y='96.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' fill='#a9b8c1' text-anchor='start' font-weight='normal'>1,841 patients; 232 AKI events (9.2%)</text><line x1='190.0' y1='110' x2='190.0' y2='144' stroke='#3a4b56' stroke-width='1.5'/><line x1='190.0' y1='120.0' x2='420' y2='120.0' stroke='#3a4b56' stroke-width='1.5'/><rect x='420' y='100.0' width='410' height='42' rx='6' fill='#111c24' stroke='#2a3a45'/><text x='430.0' y='117.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#e8eef2' text-anchor='start' font-weight='600'>Excluded: Stay &lt; 24 h (n = 893)</text><text x='430.0' y='132.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#a9b8c1' text-anchor='start' font-weight='normal'>ICU discharge or death before T, so no prediction time exists</text><rect x='40' y='144' width='300' height='54' rx='8' fill='#111c24' stroke='#2a3a45' stroke-width='1'/><text x='52.0' y='165.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#e8eef2' text-anchor='start' font-weight='600'>Remaining: 1,627 stays</text><text x='52.0