[build-system]
requires = ["setuptools>=64,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "polysafe"
version = "0.1.0"
description = "Medication-aware AKI prediction on eICU-CRD Demo v2.0.1, with leakage-controlled cohort construction."
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = ["pandas>=2.1.4,<3", "numpy>=1.26.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
