name: protocol-integrity

# Data-free checks only: the eICU tables are not in the repository (ODbL data,
# re-downloadable), so the full suite runs locally. These two need only git.
on:
  push:
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the append-only test reads every commit since the baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.1.4,<3" "numpy>=1.26.4,<2" pytest
      - name: Append-only and citation tests
        run: python -m pytest -q tests/test_preregistration.py tests/test_citations.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Research Lab image
        run: docker build -t polysafe-lab .
      - name: Serve and check
        run: |
          docker run -d -p 8000:8000 --name lab polysafe-lab
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health | grep -q '"Primary result"'
          curl -sf http://127.0.0.1:8000/ | grep -q "PolySafe Research Lab"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/results/predictions)" = 404
